seed: 7

context_embedding:
  dim: 32
  hidden_dim: 64
  n_blocks: 3
  dropout_probability: 0.0

transform:
  type: sigmoids
  n_layers: 4
  hidden_dim: 256
  sigmoids:
    n_sigmoids: 16
    num_blocks: 3
    dropout_probability: 0.2

training:
  n_epochs: 100
  batch_size: 10000
  vali_split: 0.1
  learning_rate: 1.0e-3
  weight_decay: 0.0
  scheduler_type: cosine
  n_patience_epochs: null
  min_delta: 1.0e-4
  run_c2st: true

mcmc:
  n_walkers: 1024
  n_steps: 1000
  n_burnin_steps: 1000
  method: ensemble
  use_validation_weights: false
  store_individual_chains: false

diagnostics:
  n_obs: 1000
  n_likelihood_samples: 100
  prior_selection: wide
  tests:
    hpd: true
    tarp: true
    sbc: true
    lc2st: true
